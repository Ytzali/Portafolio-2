<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Repositorio de Proyectos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #1e1e2f;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 20px;
  }
  .perfil {
    text-align: center;
    max-width: 500px;
    margin-bottom: 40px;
  }
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #8a8aff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    font-weight: bold;
    margin: 0 auto 15px;
    color: #1e1e2f;
  }
  h1 { margin-bottom: 5px; }
  .info { color: #aaa; font-size: 0.95em; margin-bottom: 10px; }
  .bio { color: #ccc; line-height: 1.5; }
  h2.seccion { margin-bottom: 20px; font-size: 1.2em; color: #f0f0f0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 800px;
    width: 100%;
  }
  .card {
    background: #2a2a40;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
    color: #f0f0f0;
    transition: transform 0.2s, background 0.2s;
  }
  .card:hover {
    background: #3a3a55;
    transform: translateY(-5px);
  }
  .card h3 { font-size: 1.1em; margin-bottom: 8px; }
  .card span { color: #8a8aff; font-size: 0.9em; }
</style>
</head>
<body>

  <div class="perfil">
    <div class="avatar">YR</div>
    <h1>Ytzali Rodríguez</h1>
    <p class="info">22 años · Estudiante de Programación</p>
    <p class="bio">Apasionada por aprender a construir cosas con código. Este es mi repositorio de proyectos, donde comparto ejercicios prácticos mientras sigo creciendo como desarrolladora.</p>
  </div>

  <h2 class="seccion">Mis Proyectos</h2>
  <div class="grid" id="grid"></div>

<script>
  const proyectos = [
    { nombre: "Lista de Tareas", desc: "To-do list", link: "proyecto1.html" },
    { nombre: "Calculadora", desc: "Operaciones básicas", link: "proyecto2.html" },
    { nombre: "Frase Aleatoria", desc: "Generador de citas", link: "proyecto3.html" }
  ];

  const grid = document.getElementById("grid");
  proyectos.forEach(p => {
    const a = document.createElement("a");
    a.href = p.link;
    a.className = "card";
    a.innerHTML = `<h3>${p.nombre}</h3><span>${p.desc}</span>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
